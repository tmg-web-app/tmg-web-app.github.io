name = "tmg-contact-form"
main = "src/index.js"
compatibility_date = "2026-09-21"

routes = [
  { pattern = "forms.mediagroup.dev/contact*", zone_name = "mediagroup.dev" }
]

[[send_email]]
name = "SEND_EMAIL"

[[d1_databases]]
binding = "DB"
database_name = "db_contact_form"
database_id = "5492eab5-eb15-49c1-ba15-0220fd9a62d5"

[vars]
CONTACT_SENDER = "contact@mediagroup.dev"
CONTACT_RECIPIENT = "tmg.web.app@gmail.com"
THANK_YOU_URL = "https://www.mediagroup.dev/thanks.html"
